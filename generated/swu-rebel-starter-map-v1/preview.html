        width: 68px;

        width: 96px;

        grid-template-columns: repeat(10, 68px);
        gap: 1px;
        width: max-content;
        background: #596174;
        padding: 1px;
      }
      .menu {
        width: 40px;
        height: 40px;
        object-fit: contain;

        grid-template-columns: repeat(10, 68px);

        padding: 14px 18px;
        margin: 22px 0;
        background: #191d30;
        border: 1px solid #3b4054;
